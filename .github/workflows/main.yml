
name: Build Debt Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

            - name: Unpack Android project
        run: |
          ZIP_FILE="DolgTrackerAndroid_v2(1).zip"
          test -f "$ZIP_FILE"
          mkdir -p android-source
          unzip -q "$ZIP_FILE" -d android-source
          PROJECT_DIR=$(dirname "$(find android-source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)")
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          PROJECT_DIR=$(dirname "$(find android-source -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)")
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle --no-daemon assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DebtTracker-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
